[package]
name = "ysmconvert-gui"
description = "YSM 模型转换器图形界面"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "YsmConvert"
path = "src/main.rs"

[dependencies]
ysmconv-core.workspace = true
serde.workspace = true
serde_json.workspace = true
# glow(OpenGL)后端比 wgpu 小得多; 字体用系统自带的中文字体(运行时读 %WINDIR%\Fonts), 不往包里塞字体
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow"] }
egui_extras = { version = "0.37", default-features = false }
rfd = { version = "0.17", default-features = false }
png = "0.18"

[target.'cfg(windows)'.dependencies.windows-sys]
workspace = true
features = ["Win32_UI_WindowsAndMessaging"]

[build-dependencies]
winresource.workspace = true
